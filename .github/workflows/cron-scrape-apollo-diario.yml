name: Scrapeo diario de contactos LATAM (Apollo)

# Corre en GitHub Actions por el mismo límite de Vercel Hobby (60s por
# función) que cron-scrape-diario.yml — pedido del usuario el 2026-09-07:
# "en apollo debe obtenerse nuevos contactos diario, latam, todo tipo de
# empresa, 150 diarios, solo correos" para la campaña Piloto LATAM.
#
# A diferencia de Apify, la búsqueda de Apollo responde de inmediato (no
# hay corrida async que esperar) — cada llamada a /api/cron-scrape-apollo
# procesa una página de hasta 100 candidatos y devuelve el resultado ya
# terminado, así que este workflow solo repite la llamada hasta juntar el
# mínimo diario, sin necesidad de sondear (poll) un resultado pendiente.
#
# Si Apollo se queda sin créditos (detenidoPorErrores:true), el workflow
# para de inmediato en vez de seguir intentando en vano — se reintenta
# solo mañana.
on:
  schedule:
    # 13:45 UTC = 7:45 AM CDMX, antes de la ventana de envío y del scrapeo
    # de Google Maps (14:00 UTC) para no cruzar ambos al mismo minuto.
    - cron: "45 13 * * 1-5"
  workflow_dispatch: {}

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar hasta juntar mínimo 150 contactos con correo
        run: |
          MIN_CON_CORREO=150
          MAX_INTENTOS=10
          totalConCorreo=0
          intento=0
          detenido="false"

          while [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ] && [ "$intento" -lt "$MAX_INTENTOS" ] && [ "$detenido" != "true" ]; do
            intento=$((intento + 1))
            echo "=== Página $intento de hasta $MAX_INTENTOS (llevamos $totalConCorreo con correo enviados) ==="

            respuesta=$(curl -sf -X POST "https://chatbotwati.vercel.app/api/cron-scrape-apollo" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            echo "Resultado: $respuesta"

            enviados=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).correosEnviados||0)}catch(e){console.log(0)}})")
            paro=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).detenidoPorErrores===true?'true':'false')}catch(e){console.log('false')}})")
            motivo=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).motivoDetencion||'')}catch(e){console.log('')}})")

            totalConCorreo=$((totalConCorreo + enviados))
            if [ "$paro" = "true" ]; then
              detenido="true"
              echo "::warning::Apollo detuvo el proceso: $motivo (total del día: $totalConCorreo contactos enviados)."
            fi
          done

          echo ""
          echo "=== RESUMEN: $totalConCorreo contactos LATAM enviados a Smartlead en $intento página(s) ==="
          if [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ] && [ "$detenido" != "true" ]; then
            echo "::warning::No se alcanzó el mínimo de $MIN_CON_CORREO contactos tras $MAX_INTENTOS páginas (se lograron $totalConCorreo)."
          fi
