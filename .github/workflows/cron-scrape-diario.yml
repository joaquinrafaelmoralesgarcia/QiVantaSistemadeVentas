name: Scrapeo diario de leads (Apify)

# Corre en los runners de GitHub Actions (máquinas de GitHub, no en Vercel
# ni en tu computadora) — necesario porque Apify tarda varios minutos en
# terminar y las funciones de Vercel Hobby se cortan a los 60s.
#
# Sigue disparando búsquedas (rubro+ciudad al azar, hasta 50 negocios cada
# una) hasta juntar un MÍNIMO de 50 leads nuevos ese día, con un tope de
# seguridad de 10 búsquedas para no disparar el costo si un día le toca
# mala racha de rubros/ciudades con poco volumen en Google Maps.
on:
  schedule:
    # 14:00 UTC = 8:00 AM hora de Ciudad de México, antes de que abra la
    # ventana de envío de correos (10:15) para que los leads del día ya
    # estén listos.
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar hasta juntar mínimo 50 leads nuevos
        run: |
          MIN_LEADS=50
          MAX_INTENTOS=10
          total=0
          intento=0

          while [ "$total" -lt "$MIN_LEADS" ] && [ "$intento" -lt "$MAX_INTENTOS" ]; do
            intento=$((intento + 1))
            echo "=== Búsqueda $intento de hasta $MAX_INTENTOS (llevamos $total leads nuevos) ==="

            respuesta=$(curl -sf -X POST "https://chatbotwati.vercel.app/api/cron-scrape" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
            echo "Inicio: $respuesta"
            runId=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).runId))")
            query=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).query))")

            if [ -z "$runId" ]; then
              echo "No se pudo iniciar esta búsqueda, se salta."
              continue
            fi

            terminada="false"
            for i in $(seq 1 40); do
              sleep 15
              estado=$(curl -sf "https://chatbotwati.vercel.app/api/cron-scrape?runId=$runId&query=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$query")" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
              echo "  poll $i: $estado"
              listo=$(echo "$estado" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).listo))")
              if [ "$listo" = "true" ]; then
                nuevos=$(echo "$estado" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).nuevos))")
                total=$((total + nuevos))
                terminada="true"
                echo "Búsqueda $intento terminada: $nuevos nuevos (total del día: $total)."
                break
              fi
            done

            if [ "$terminada" != "true" ]; then
              echo "Esta búsqueda no terminó dentro del tiempo de espera (10 min), se sigue con la siguiente."
            fi
          done

          echo ""
          echo "=== RESUMEN: $total leads nuevos en $intento búsqueda(s) ==="
          if [ "$total" -lt "$MIN_LEADS" ]; then
            echo "::warning::No se alcanzó el mínimo de $MIN_LEADS leads/día tras $MAX_INTENTOS intentos (se lograron $total)."
          fi
