name: Scrapeo diario de leads (Apify)

# Corre en los runners de GitHub Actions (máquinas de GitHub, no en Vercel
# ni en tu computadora) — necesario porque Apify tarda varios minutos en
# terminar y las funciones de Vercel Hobby se cortan a los 60s.
#
# Objetivo real: 150 leads CON CORREO/día (25 correos x 6 cuentas de envío
# de Smartlead) — no 150 negocios en total. Como solo ~40-45% de los
# negocios encontrados traen correo, sigue disparando búsquedas (rubro+
# ciudad al azar, hasta 50 negocios cada una) hasta juntar ese mínimo de
# leads con correo, con un tope de seguridad de 25 búsquedas para acotar
# el costo si un día toca mala racha de rubros/ciudades con poco correo
# público.
on:
  schedule:
    # 14:00 UTC = 8:00 AM hora de Ciudad de México, antes de que abra la
    # ventana de envío de correos (10:15) para que los leads del día ya
    # estén listos.
    - cron: "0 14 * * 1-5"
  workflow_dispatch: {}

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar hasta juntar mínimo 150 leads con correo
        run: |
          MIN_CON_CORREO=150
          MAX_INTENTOS=25
          totalConCorreo=0
          totalNuevos=0
          intento=0

          while [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ] && [ "$intento" -lt "$MAX_INTENTOS" ]; do
            intento=$((intento + 1))
            echo "=== Búsqueda $intento de hasta $MAX_INTENTOS (llevamos $totalConCorreo con correo / $totalNuevos negocios nuevos) ==="

            # Sin -f y con "|| true" — un intento fallido ya no debe
            # abortar todo el ciclo (bash -e, encontrado el 2026-09-14 en
            # el workflow de LATAM con el mismo patrón).
            respuesta=$(curl -s -X POST "https://chatbotwati.vercel.app/api/cron-scrape" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo '{}')
            echo "Inicio: $respuesta"
            runId=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).runId||'')}catch(e){console.log('')}})")
            query=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).query||'')}catch(e){console.log('')}})")

            if [ -z "$runId" ]; then
              echo "No se pudo iniciar esta búsqueda, se salta."
              continue
            fi

            terminada="false"
            for i in $(seq 1 40); do
              sleep 15
              estado=$(curl -s "https://chatbotwati.vercel.app/api/cron-scrape?runId=$runId&query=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$query")" \
                -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo '{}')
              echo "  poll $i: $estado"
              listo=$(echo "$estado" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).listo))")
              if [ "$listo" = "true" ]; then
                nuevos=$(echo "$estado" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).nuevos))")
                conCorreo=$(echo "$estado" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).conCorreo))")
                totalNuevos=$((totalNuevos + nuevos))
                totalConCorreo=$((totalConCorreo + conCorreo))
                terminada="true"
                echo "Búsqueda $intento terminada: $nuevos nuevos, $conCorreo con correo (total del día: $totalConCorreo con correo / $totalNuevos negocios)."
                break
              fi
            done

            if [ "$terminada" != "true" ]; then
              echo "Esta búsqueda no terminó dentro del tiempo de espera (10 min), se sigue con la siguiente."
            fi
          done

          echo ""
          echo "=== RESUMEN: $totalConCorreo leads con correo ($totalNuevos negocios nuevos en total) en $intento búsqueda(s) ==="
          if [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ]; then
            echo "::warning::No se alcanzó el mínimo de $MIN_CON_CORREO leads con correo tras $MAX_INTENTOS intentos (se lograron $totalConCorreo)."
          fi

