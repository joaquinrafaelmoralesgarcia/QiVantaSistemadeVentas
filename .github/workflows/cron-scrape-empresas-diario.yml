name: Captación continua de contactos LATAM (Apollo + Hunter)

# Antes se llamaba cron-scrape-apollo-diario.yml; se renombró el
# 2026-09-07 al agregar Hunter.io como segunda fuente de contactos para
# Piloto LATAM mientras se renuevan los créditos de Apollo (28 de
# septiembre) — Hunter sí da acceso a su API en el plan gratis, a
# diferencia de Snov.io/Lusha/Kaspr/Adapt.io que la reservan para planes
# de paga.
#
# La captación es independiente de Smartlead: guarda contactos en Mongo y
# los agrega a la cola aun cuando Piloto LATAM esté pausada. Cada ejecución
# procesa un lote pequeño para distribuir créditos de Apollo durante el día.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Captar un lote de contactos sin activar envíos
        run: |
          # Ventana extraordinaria solicitada el 2026-10-05: captar solo
          # durante ocho horas. Apollo solo revela correo; no pide teléfonos.
          CAPTACION_HASTA_UTC="2026-10-06T11:15:00Z"
          if [ "$(date -u +%s)" -ge "$(date -u -d "$CAPTACION_HASTA_UTC" +%s)" ]; then
            echo "Ventana de captación cerrada ($CAPTACION_HASTA_UTC)."
            exit 0
          fi
          # Anteriormente MAX_INTENTOS era 55 en una sola corrida diaria — pedido explícito
          # del usuario: "mi suscripcion de apollo me da para mas de 2 mil
          # leads al mes, como aseguramos que cuando vuelva a pagar no se
          # pierdan esos creditos". Cada intento procesa como máximo 2
          # candidatos NUEVOS de Apollo (MAX_NUEVOS_POR_CORRIDA en
          # _leadsProcessorEmpresa.js — ese tope es por el límite de 60s de
          # Vercel Hobby por invocación, no se toca). Con 10 intentos el
          # techo real eran ~20 candidatos de Apollo/día — a 5 días/semana
          # eso es ~400-430/mes, muy por debajo de los 2000+ que da la
          # suscripción: la mayoría de los créditos se hubieran quedado sin
          # usar cada mes. Con 55 intentos el techo sube a ~110/día
          # (~2,100-2,300/mes en los ~21 días hábiles de un mes), suficiente
          # para agotar el cupo mensual real antes de que se renueve.
          MIN_CON_CORREO=1
          MAX_INTENTOS=1
          totalConCorreo=0
          intento=0
          detenido="false"

          while [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ] && [ "$intento" -lt "$MAX_INTENTOS" ] && [ "$detenido" != "true" ]; do
            intento=$((intento + 1))
            echo "=== Intento $intento de hasta $MAX_INTENTOS (llevamos $totalConCorreo con correo enviados) ==="

            # Sin -f y con "|| true" — un intento fallido (ej. timeout de
            # 60s de Vercel, encontrado el 2026-09-14: el workflow entero
            # abortaba con "bash -e" tras un solo intento fallido,
            # perdiendo el resto de los intentos del día) ya NO tumba todo
            # el ciclo, solo cuenta 0 para ese intento y sigue con el
            # siguiente.
            respuesta=$(curl -s -X POST "https://chatbotwati.vercel.app/api/cron-scrape-empresas" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" || echo '{}')
            echo "Resultado: $respuesta"

            enviados=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).correosEnviados||0)}catch(e){console.log(0)}})")
            paro=$(echo "$respuesta" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).detenidoPorErrores===true?'true':'false')}catch(e){console.log('false')}})")

            totalConCorreo=$((totalConCorreo + enviados))
            if [ "$paro" = "true" ]; then
              detenido="true"
              echo "::warning::Ambas fuentes (Apollo y Hunter) se quedaron sin nada que dar hoy (total del día: $totalConCorreo contactos enviados)."
            fi
          done

          echo ""
          echo "=== RESUMEN: $totalConCorreo contactos LATAM enviados a Smartlead en $intento intento(s) ==="
          if [ "$totalConCorreo" -lt "$MIN_CON_CORREO" ] && [ "$detenido" != "true" ]; then
            echo "::warning::No se alcanzó el mínimo de $MIN_CON_CORREO contactos tras $MAX_INTENTOS intentos (se lograron $totalConCorreo)."
          fi

