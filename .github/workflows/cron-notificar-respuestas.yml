name: Notificar respuestas de correo a info@qi-vanta.com

# Pedido explícito del usuario el 2026-09-22: "de cualquier campaña si
# alguien contesta un correo recuerda enviarlo a la cuenta de
# info@qi-vanta.com... desde también el buzón maestro de smartlead".
# Corre cada 30 min durante el horario real de envío de las 3 campañas
# (9am-7pm CDMX = 15:00-01:00 UTC) — se puede tardar hasta 30 min en
# avisar de una respuesta nueva, aceptable para este caso.
on:
  schedule:
    - cron: "*/30 15-23,0 * * 1-6"
  workflow_dispatch: {}

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --production
      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EOF
      - name: Revisar buzón maestro y notificar respuestas nuevas
        run: node scripts/notificar-respuestas.js
