name: Notificar todas las respuestas de correo a Joaquin

# Toda respuesta del buzón maestro de Smartlead se reenvía a
# joaquin.morales@qi-vanta.com y se guarda en Mongo, sin importar campaña
# o clasificación. Corre cada 10 min, incluido fuera del horario de envío.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --production
      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          GMAIL_USER=${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
          EOF
      - name: Revisar buzón maestro y notificar respuestas nuevas
        run: node scripts/notificar-respuestas.js
