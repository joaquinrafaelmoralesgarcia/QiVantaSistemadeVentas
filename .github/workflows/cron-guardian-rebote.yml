name: Guardián de rebote de campañas

# Decisión del usuario el 2026-10-08: "haz lo que mejor recomiendes, y sube
# todo al cron". Mide el rebote de los últimos 7 días de cada campaña y
# ajusta su ritmo solo: normal (<=5%), reducido a 10 leads/día (5-15%), o
# pausa de 7 días (>15%) con reanudación automática en modo reducido.
# Alianzas queda en reposo hasta el 2026-10-22 y Laboratorios hasta el
# 2026-10-15; después el guardián las reanuda a goteo y las vuelve a pausar
# solo si el rebote sigue alto. Ver scripts/cron-guardian-rebote.js.
#
# Corre en GitHub Actions (no en esta computadora). Cada 3 horas: el rebote
# llega con retraso de horas, así que medir más seguido no aporta.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch: {}

jobs:
  vigilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --production
      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          EOF
      - name: Revisar rebote y ajustar campañas
        run: node scripts/cron-guardian-rebote.js
