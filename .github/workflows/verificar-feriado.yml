name: Pausar campañas en días festivos (México)

# Pedido explícito del usuario el 2026-09-13: "los dias festivos en
# mexico no mandes correo ni llamadas de ninguna campaña". Reconfirmado el
# 2026-10-09: "ejecutar las campañas y envíos de lunes a viernes y menos
# feriados". Pausa las campañas si la PRÓXIMA ventana de envío (8am-7pm
# CDMX) cae en festivo oficial LFT, y las reactiva cuando ya no.
#
# Cada 3 horas, no una vez al día: GitHub dispara los cron con ~6 horas de
# retraso (la corrida de "7am CDMX" llegaba ~1pm), así que con una sola
# corrida un festivo arrancaba enviando toda la mañana. Con varias corridas
# y mirando la próxima ventana, la de la noche anterior ya pausa a tiempo.
on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --production
      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          SMARTLEAD_CAMPAIGN_ID=${{ secrets.SMARTLEAD_CAMPAIGN_ID }}
          SMARTLEAD_CAMPAIGN_ID_LATAM=${{ secrets.SMARTLEAD_CAMPAIGN_ID_LATAM }}
          EOF
      - name: Verificar feriado y pausar/reactivar
        run: node scripts/verificar-feriado.js
