name: Sincronizar métricas de aperturas (semanal)

# Pedido explícito del usuario el 2026-09-12: "esto me lo mostraras cada
# semana para que prepares la logica de negocio". Corre scripts/
# sincronizar-aperturas.js directo (no un endpoint de Vercel) porque
# sincroniza cientos/miles de leads contra Smartlead, muy por encima de
# los 60s que da Vercel Hobby — ver el propio script para el detalle.
on:
  schedule:
    # Lunes 8:00 AM CDMX (14:00 UTC) — antes de que arranque la ventana de
    # envío del día, para tener el reporte listo desde temprano en la semana.
    - cron: "0 14 * * 1"
  workflow_dispatch: {}

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Instalar dependencias
        run: npm install --production
      - name: Generar .env.local desde secrets
        run: |
          cat > .env.local << EOF
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_DB=${{ secrets.MONGODB_DB }}
          SMARTLEAD_API_KEY=${{ secrets.SMARTLEAD_API_KEY }}
          SMARTLEAD_CAMPAIGN_ID=${{ secrets.SMARTLEAD_CAMPAIGN_ID }}
          SMARTLEAD_CAMPAIGN_ID_LATAM=${{ secrets.SMARTLEAD_CAMPAIGN_ID_LATAM }}
          DEEPINFRA_API_KEY=${{ secrets.DEEPINFRA_API_KEY }}
          EOF
      - name: Sincronizar aperturas y clasificar
        run: node scripts/sincronizar-aperturas.js

